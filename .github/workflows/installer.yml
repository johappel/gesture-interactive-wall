name: Installer bauen

# Baut WIRKLICHT-Setup-<Version>.exe und legt sie als Artefakt ab.
#
# Ausloeser:
#   - manuell (workflow_dispatch) fuer einen Probelauf
#   - ein Tag v<Version> erzeugt zusaetzlich ein GitHub-Release
#
# Der Tag muss zur VERSION-Datei passen: der Tag benennt das Release, die
# VERSION-Datei den Inhalt der setup.exe. Laufen beide auseinander, haengt
# unter dem Release v0.0.2 eine setup.exe mit der Version 0.5.4. Der Workflow
# bricht in diesem Fall ab.
#
# Bewusst nicht bei jedem Push: der Installer ist ein Betriebsmittel, kein
# Entwicklungsergebnis. Vor einem Veranstaltungseinsatz wird er gezielt gebaut.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Version ermitteln und pruefen
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "VERSION ist leer." }
          if ($version -notmatch '^\d+\.\d+\.\d+([.\-+].*)?$') { throw "VERSION hat kein gueltiges Format: $version" }

          $expectedTag = "v$version"
          # Ein Tag-Release muss zur VERSION-Datei passen. Sonst haengt unter dem
          # Release v0.0.2 eine setup.exe mit der Version 0.5.4 — die Datei traegt
          # dann eine andere Version als ihr Release. Der Tag ist die Wahrheit
          # fuer den Namen des Releases, die VERSION-Datei fuer den Inhalt; beide
          # muessen denselben Stand bezeichnen.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            # Die Formatierung muss den vollstaendigen Text umfassen: -f bindet
            # staerker als +, sonst blieben die Platzhalter im ersten Teil
            # unersetzt stehen.
            $message = ("Tag '{0}' passt nicht zur VERSION-Datei ('{1}'). " +
                        "Entweder VERSION auf '{2}' setzen oder den Tag '{3}' verwenden.") -f `
                        $env:GITHUB_REF_NAME, $version, ($env:GITHUB_REF_NAME -replace '^v', ''), $expectedTag
            throw $message
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version (Tag: $expectedTag)"

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          # Chocolatey ist auf windows-latest vorhanden; winget ist dort nicht
          # verlaesslich verfuegbar.
          choco install innosetup --yes --no-progress

      - name: Installer bauen
        shell: pwsh
        run: |
          ./installer/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Setup.exe pruefen
        shell: pwsh
        run: |
          $expected = "dist/WIRKLICHT-Setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path -LiteralPath $expected)) { throw "Setup.exe fehlt: $expected" }
          $size = (Get-Item -LiteralPath $expected).Length
          if ($size -lt 1MB) { throw "Setup.exe ist unerwartet klein: $size Bytes" }
          Write-Host ("Setup.exe: {0} ({1} MB)" -f $expected, [math]::Round($size / 1MB, 2))

      - name: Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: WIRKLICHT-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
